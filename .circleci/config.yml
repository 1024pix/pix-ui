version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

executors:
  node-browsers-docker:
    parameters:
      node-version:
        # renovate datasource=node-version depName=node
        default: 24.19.0
        type: string
    docker:
      - image: cimg/node:<<parameters.node-version>>-browsers
    resource_class: small

workflows:
  version: 2
  build-and-test:
    jobs:
      - checkout:
          context: PixUI
          filters:
            branches:
              ignore:
                - gh-pages
      - lint:
          context: PixUI
          requires:
            - checkout
      - test:
          context: PixUI
          requires:
            - checkout

jobs:
  checkout:
    executor:
      name: node-browsers-docker
    working_directory: ~/pix-ui
    steps:
      - attach_workspace:
          at: ~/pix-ui
      - checkout
      - run: cat package*.json > cachekey
      - restore_cache:
          keys:
            - v7-npm-{{ checksum "cachekey" }}
      - run: npm ci
      - save_cache:
          key: v7-npm-{{ checksum "cachekey" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: ~/pix-ui
          paths:
            - .

  lint:
    executor: node-browsers-docker
    working_directory: ~/pix-ui
    steps:
      - attach_workspace:
          at: ~/pix-ui
      - run: npm run lint:js
      - run: npm run lint:hbs
      - run: npm run lint:scss

  test:
    executor: node-browsers-docker
    working_directory: ~/pix-ui
    resource_class: large
    steps:
      - browser-tools/install_chrome
      - attach_workspace:
          at: ~/pix-ui
      - run: npm run test
